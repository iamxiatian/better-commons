[project]
name = "better-commons"
version = "0.3.3"
description = "better commons python library"
readme = "README.md"
authors = [
    { name = "夏天", email = "xiat@ruc.edu.cn" }
]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=50.0.0",
    "httpx>=0.28.1",
    "orjson>=3.11.9",
    "pillow>=12.3.0",
    "pymupdf>=1.28.0",
    "python-dotenv>=1.2.1",
    "rich>=14.3.2",
    "structlog>=25.5.0",
]

[project.scripts]
commons = "commons:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commons"]

[[tool.uv.index]]
name= "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"



[tool.uv.build-backend]
source-exclude = [
    "**/__pycache__",  # 排除所有 __pycache__ 目录
    "**/*.pyc",        # 排除所有 .pyc 文件
    ".zed",           # 排除 .zed 目录
    ".claude",        # 排除 .claude 目录
    ".venv",           # 排除虚拟环境目录
    "tests",           # 排除根目录下的 tests 文件夹
    "/db",            # 排除根目录下的 docs 文件夹
    "/dataset",
    "/dist"
]
wheel-exclude = [
    "/tests",
    "**/__pycache__",
]

[tool.ruff]
# 排除一些经常被忽略的目录。
exclude = [
    "config",
    "build",
    "dist",
    "ipynb",
    "site-packages",
    ".venv",
    "setup.py"
]

line-length = 80
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "C9", "UP", "S", "RUF"]
ignore = ["E501", "S101", "RUF003", "RUF001", "RUF002", "S314", "S105"]
fixable = ["ALL"]

# 允许以下划线为前缀的未使用变量。
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# 设置圈复杂度阈值
[tool.ruff.lint.mccabe]
# 需要同时在[tool.ruff]的select中启用C901，或者直接设置为ALL。
max-complexity = 8


[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]

# 像 Black 一样，字符串使用双引号。
quote-style = "double"

# 像 Black 一样，用空格缩进，而不是制表符。
indent-style = "space"

# 像 Black 一样，保留魔术尾随逗号。
skip-magic-trailing-comma = false

# 像 Black 一样，自动检测合适的行尾。
line-ending = "auto"

# Pyright配置：静态类型检查
[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = "information"
reportUnusedVariable = "error"

[[tool.pyright.executionEnvironments]]
root = "src"

# tests/ 目录中的测试文件可以解析 src 下的包
[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["src"]


[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "basedpyright>=1.39.6",
    "ruff>=0.15.18",
    # 文档站点构建（mkdocs build / mkdocs gh-deploy）
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.28",
]
